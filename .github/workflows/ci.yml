# CI de planillas-ccdr.
#
# Falla si: gofmt lista archivos, go vet reporta, no compila, falla una prueba
# unitaria (incluye TestMigracionesLint: una migración con ON DUPLICATE KEY
# UPDATE, INSERT IGNORE, DROP TABLE IF EXISTS o DELIMITER rompe la CI), falla
# una prueba de integración contra MySQL 8, el ciclo de migraciones
# up → down → up no queda limpio, govulncheck encuentra una vulnerabilidad
# alcanzable o gosec reporta un hallazgo de severidad alta.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  estatico:
    name: formato, vet, build y unitarias
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Último parche de 1.26: govulncheck también revisa la biblioteca estándar.
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - name: gofmt
        run: |
          sin_formato="$(gofmt -l .)"
          if [ -n "$sin_formato" ]; then echo "Archivos sin formatear:"; echo "$sin_formato"; exit 1; fi
      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...
      - name: go build
        run: go build ./...
      - name: pruebas unitarias (incluye el lint de migraciones)
        run: go test ./... -count=1

  seguridad:
    name: govulncheck y gosec
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Último parche de 1.26: govulncheck también revisa la biblioteca estándar.
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: gosec (severidad y confianza altas)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
          gosec -severity high -confidence high -exclude-generated ./...

  integracion:
    name: integración con MySQL 8 y ciclo de migraciones
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot_ci --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      # Los tests crean y borran su propia base (testutil.NuevaBD).
      TEST_DATABASE_URL: root:root_ci@tcp(127.0.0.1:3306)/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Último parche de 1.26: govulncheck también revisa la biblioteca estándar.
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - name: configurar MySQL (triggers con binlog, UTC)
        run: |
          mysql -h 127.0.0.1 -uroot -proot_ci -e "SET GLOBAL log_bin_trust_function_creators = 1; SET GLOBAL time_zone = '+00:00';"
      - name: ciclo de migraciones up → down → up
        env:
          APP_ENV: development
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: root_ci
          DB_NAME: ci_migraciones
          DB_TLS_MODE: disabled
        run: |
          mysql -h 127.0.0.1 -uroot -proot_ci -e "CREATE DATABASE ci_migraciones CHARACTER SET utf8mb4"
          go run ./cmd/migrate up
          total="$(ls db/migrations/*.up.sql | wc -l)"
          go run ./cmd/migrate down "$total"
          go run ./cmd/migrate up
          go run ./cmd/migrate version
      - name: pruebas de integración
        # -p 1: un solo MySQL; en paralelo los paquetes lo saturan (ver docs/pruebas.md).
        run: go test -p 1 -tags=integration ./... -count=1 -timeout=45m
