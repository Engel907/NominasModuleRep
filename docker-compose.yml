# SOLO desarrollo / CI. No usar en producción.
# Lee DB_NAME, DB_USER, DB_PASSWORD, DB_PORT desde el entorno o el .env del
# proyecto, con los mismos nombres que usa internal/config.
services:
  mysql:
    image: mysql:8.0
    container_name: planillas-ccdr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev}
      MYSQL_DATABASE: ${DB_NAME:-planillas_ccdr}
      MYSQL_USER: ${DB_USER:-planillas}
      MYSQL_PASSWORD: ${DB_PASSWORD:-planillas_dev}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
      # Con el binlog activo (por defecto en MySQL 8), un usuario sin SUPER no
      # puede crear triggers (error 1419) salvo con esta opción. El esquema
      # tiene 204 triggers de auditoría.
      - --log-bin-trust-function-creators=1
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - planillas_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  planillas_mysql_data: